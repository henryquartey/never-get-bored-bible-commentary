<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Never Get Bored — Nii Okai's Journal Through Scripture</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAFAF8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nii Okai's Bible Journal">
<style>
:root{
  --bg:#FAFAF8; --panel:#FFFFFF; --ink:#1B1B19; --soft:#8B8B86; --line:#E8E7E3;
  --accent:#1F1F1D; --accent-rgb:31,31,29; --accent-soft:#F1F0EC; --note-bg:#F7F6F3; --note-line:#C9C7C0;
  --accent-deep:#000000; --on-accent:#FFFFFF;
  --scripture:#1E1E1C; --shadow:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.04);
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#141414; --panel:#1D1D1B; --ink:#EAE8E4; --soft:#9B9994; --line:#2F2E2B;
  --accent:#E8E6E1; --accent-rgb:232,230,225; --accent-soft:#2A2926; --note-bg:#232320; --note-line:#57554F;
  --accent-deep:#C9C7C1; --on-accent:#161614;
  --scripture:#EDEBE7; --shadow:0 1px 3px rgba(0,0,0,.35),0 8px 28px rgba(0,0,0,.45);
}
html[data-theme="dark"] body{-webkit-font-smoothing:auto;-moz-osx-font-smoothing:auto}
html[data-theme="dark"] .verse{color:var(--scripture)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent)}
.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:280px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;transition:margin-left .25s ease}
.brand{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.brand-top{display:flex;margin-bottom:8px}
.brand-top .copytrig.menu-3{padding:6px 10px;font-size:15px}
.brand h1{font-family:var(--serif);font-size:27px;margin:0;font-weight:800;letter-spacing:.2px;line-height:1.1}
/* Library section (reference works) */
.lib-section{padding:10px 14px;border-bottom:1px solid var(--line)}
.lib-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--soft);font-weight:700;margin-bottom:7px}
.lib-head span{text-transform:none;letter-spacing:0;font-weight:500;opacity:.85}
.lib-item{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;
  padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink);
  font-family:var(--sans);font-size:13px;cursor:pointer}
.lib-item:hover{background:var(--accent-soft)}
.lib-item.on{background:rgba(107,122,168,.10);border-color:#6b7aa8;color:#4a5680;font-weight:600}
.lib-name{text-align:left}
.lib-state{font-size:11px;font-weight:700;color:var(--soft);border:1px solid var(--line);border-radius:20px;padding:1px 9px}
.lib-item.on .lib-state{color:#4a5680;border-color:#6b7aa8}
.brand p{margin:5px 0 0;font-size:12px;color:var(--soft)}
.brand .ver{margin-top:6px;font-size:10.5px;color:var(--soft);opacity:.7;letter-spacing:.3px}
.side-actions{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.side-actions button{font-size:12.5px;padding:7px 10px;border:1px solid var(--line);background:transparent;
  color:var(--ink);border-radius:8px;flex:1;min-width:0;white-space:nowrap}
.side-actions button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.side-actions.tabs button{flex:1 1 40%}  /* 2-per-row so "Read Bible" never gets clipped */
.resizer{flex:0 0 6px;cursor:col-resize;background:var(--line)}
.resizer:hover,.resizer.dragging{background:var(--accent)}
.jmrow{padding:6px 14px 10px;border-bottom:1px solid var(--line)}
.jmlbl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--soft);font-weight:700;margin-bottom:6px}
.jmlbl em{font-style:normal;color:var(--accent);text-transform:none;letter-spacing:0}
.jmtoggle{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.jmtoggle button{flex:1;font-size:12.5px;padding:7px 8px;border:none;background:transparent;color:var(--ink);cursor:pointer;font-family:var(--sans);font-weight:600}
.jmtoggle button.on{background:var(--accent);color:var(--on-accent)}
body.as-public .owner-only{display:none!important}
body.is-reader .owner-only{display:none!important}
body.is-reader .cdot{display:none!important}
body.is-reader #previewRow{display:none!important}
body.is-reader .brand .copymenu{display:none!important}
body.is-reader #uiSwitch{display:none!important}
/* track-changes inside a modern note */
.note .trk{margin-top:9px;border-top:1px dashed var(--note-line);padding-top:8px}
.note .trk summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--soft);list-style:none}
.note .trk summary::-webkit-details-marker{display:none}
.note .trk .sub{display:flex;gap:6px;margin:8px 0}
.note .trk .sub button{font-size:11px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer;font-family:var(--sans)}
.note .trk .sub button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.note .draft2{font-size:13px;color:var(--soft);white-space:pre-wrap;border-left:2px solid var(--line);padding-left:10px;margin:6px 0}
.note .draft2 .dl{display:block;font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;margin-bottom:2px}
.note .chg2{font-size:12px;font-style:italic;color:var(--soft);margin-top:6px}
.note .dl{display:block;font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;margin-bottom:3px}
.note .trk[data-m="stack"] .tk-side{display:none}
.note .trk[data-m="side"] .tk-stack{display:none}
.note .sxs2{display:flex;gap:12px}.note .sxs2>div{flex:1;min-width:0}
.note .modtag{font-size:10px;background:var(--accent);color:var(--on-accent);border-radius:20px;padding:1px 7px;font-weight:700}
@media(max-width:860px){.note .sxs2{flex-direction:column}}
@media(pointer:coarse){#reader .verse{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.booklist{overflow-y:auto;flex:1 1 auto;min-height:0;padding:8px 8px 40px}
.sidebar{overflow:hidden}
.book-group{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--soft);
  padding:14px 12px 6px;font-weight:600}
.book{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;
  font-size:14px;cursor:pointer;color:var(--ink)}
.book:hover{background:var(--accent-soft)}
.book.active{background:var(--accent);color:var(--on-accent)}
.book .cdot{font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 6px;text-align:center;border-radius:999px;
  background:var(--note-line);color:#3a2c14;font-weight:600}
.book.active .cdot{background:rgba(255,255,255,.3);color:var(--on-accent)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:var(--panel);flex-shrink:0}
.menu-btn{display:none;background:transparent;border:none;font-size:22px;color:var(--ink);padding:0 4px}
.crumb{font-family:var(--serif);font-size:18px;font-weight:600;flex-shrink:0}
.chapsel{display:flex;align-items:center;gap:6px}
.chapsel select,.versel{background:var(--bg);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:7px 9px;font-size:13.5px;font-family:inherit;max-width:220px}
.spacer{flex:1}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;
  width:38px;height:38px;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn.active{background:var(--accent-soft);border-color:var(--accent)}
body.as-public::before{content:"👁 Previewing as a public reader — your owner-only tools are hidden. Click “Exit reader preview” to return.";
  display:block;background:var(--accent);color:var(--on-accent);font-family:var(--sans);font-size:12.5px;font-weight:600;
  text-align:center;padding:7px 12px;position:sticky;top:0;z-index:60}
.searchwrap{position:relative}
.searchwrap input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:8px 10px 8px 32px;font-size:13.5px;width:180px;font-family:inherit}
.searchwrap::before{content:"⌕";position:absolute;left:10px;top:7px;color:var(--soft);font-size:16px}

.reader{overflow-y:auto;flex:1;min-height:0;padding:30px 16px 40px}
.page{max-width:1080px;margin:0 auto}
.chap-title{font-family:var(--serif);font-size:30px;text-align:center;margin:0 0 4px;font-weight:600}
.chap-sub{text-align:center;color:var(--soft);font-size:13px;margin-bottom:28px}

.chapnote{background:var(--note-bg);border:1px solid var(--note-line);border-radius:12px;
  padding:16px 18px;margin:0 0 26px}
.chapnote .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent);font-weight:700;margin-bottom:6px}

.verse{padding:3px 8px;border-radius:8px;position:relative;font-family:var(--serif);
  font-size:calc(18.5px*var(--fs,1));line-height:1.72;color:var(--scripture);scroll-margin-top:80px}
.verse .vn{font-size:11px;font-weight:700;color:var(--soft);vertical-align:super;margin-right:5px;
  font-family:var(--sans);cursor:pointer;user-select:none}
.verse:hover{background:var(--accent-soft)}
.verse.has-note{background:var(--note-bg)}
.verse.has-note:hover{background:var(--accent-soft)}
/* hover-only tone deepens with the number of notes on the verse */
.verse.nc1:hover{background:rgba(var(--accent-rgb),.10)}
.verse.nc2:hover{background:rgba(var(--accent-rgb),.20);border-left-width:5px}
.verse.nc3:hover{background:rgba(var(--accent-rgb),.32);border-left-width:7px}
.note .who{font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.09em;color:var(--accent);
  border:1px solid currentColor;border-radius:4px;padding:1px 6px;vertical-align:1px}
.note .who.mine{color:var(--soft)}
.vmenu .vm-sec{font-family:var(--sans);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:7px 11px 2px}
.vmenu .vm-row{display:flex;gap:6px;padding:4px 8px}
.vmenu .vm-row button{flex:1;text-align:center;border:1px solid var(--line)}
.vmenu .vm-voice{width:calc(100% - 16px);margin:2px 8px 4px;font-size:12.5px}
.vmenu .vm-div{height:1px;background:var(--line);margin:6px 4px}
.readnav .rn-listen{flex:0 0 auto;background:var(--accent);color:var(--on-accent);border-color:var(--accent);border-radius:999px;padding:11px 22px}
.readnav .rn-listen:hover:not(:disabled){color:var(--on-accent);border-color:var(--accent);opacity:.92}
/* Human-narration player (LibriVox KJV) — sits above the chapter nav */
.audbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;max-width:1080px;margin:0 auto;padding:9px 20px 0;font-family:var(--sans)}
.audbar .ab-btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;flex:0 0 auto}
.audbar .ab-btn:hover{border-color:var(--accent);color:var(--accent)}
.audbar .ab-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.audbar .ab-seek{flex:1 1 160px;min-width:120px;height:22px;margin:0;accent-color:var(--accent);cursor:pointer;
  -webkit-appearance:none;appearance:none;background:transparent}
.audbar .ab-seek::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--ab-track,var(--line))}
.audbar .ab-seek::-moz-range-track{height:6px;border-radius:3px;background:var(--ab-track,var(--line))}
.audbar .ab-seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.audbar .ab-seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.audbar .ab-time{font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:92px;text-align:center}
.audbar .ab-lbl{flex:1 1 100%;font-size:11.5px;color:var(--soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap;line-height:1.35}
.audbar .ab-lbl b{color:var(--ink);font-weight:700}
.audbar .ab-lbl .ab-follow{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
.audbar .ab-buf{color:var(--accent);font-weight:700}
.audnote{max-width:1080px;margin:0 auto;padding:9px 20px 0;font-family:var(--sans);font-size:12.5px;line-height:1.4;color:var(--ink)}
.audnote > div{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:flex-start}
.audnote button{margin-left:auto;background:none;border:0;color:var(--soft);font-size:15px;cursor:pointer;line-height:1;padding:0 2px}
@media (max-width:520px){ .audbar{padding:8px 12px 0} .audbar .ab-time{min-width:78px;font-size:11px} .audnote{padding:8px 12px 0} }
.fabnotes{position:fixed;right:14px;bottom:118px;z-index:55;opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .25s ease,transform .25s ease;font-family:var(--sans);font-size:12.5px;font-weight:600;max-width:70vw;white-space:nowrap;
  background:var(--panel);color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:10px 15px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
.fabnotes.show{opacity:1;pointer-events:auto;transform:none}
.notetools .corrlink{background:none;border:none;color:var(--soft);font-family:var(--sans);font-size:12px;cursor:pointer;padding:6px 8px;border-radius:8px;vertical-align:middle}
.notetools .corrlink:hover{color:var(--accent);background:var(--accent-soft)}
/* On phones and tablets a commented verse is marked by its badge and a hairline
   only. The block tint reads as clutter while scrolling on a small screen, and
   some mobile browsers leave a tapped verse stuck in its hover colour. Desktop
   keeps the full tint and hover behaviour. */
@media(pointer:coarse){
  .verse.has-note{background:none}
  .verse:hover{background:none}
  .verse.has-note:hover,.verse.nc1:hover,.verse.nc2:hover,.verse.nc3:hover{background:none}
}
/* floating verse action menu */
.vmenu{position:fixed;z-index:210;min-width:180px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.2);padding:5px}
.vmenu button{display:block;width:100%;text-align:left;font-family:var(--sans);font-size:13.5px;
  background:none;border:none;color:var(--scripture);border-radius:8px;padding:9px 11px;cursor:pointer}
.vmenu button:hover{background:var(--accent-soft);color:var(--accent)}
.verse .vmenu-btn{background:transparent;color:var(--soft);border:1px solid var(--line);font-weight:700;line-height:1;padding:2px 8px}
.verse .vmenu-btn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.verse .cmark{display:none}
.verse.has-note .cmark{display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.04em;
  background:none;color:var(--soft);border:1px solid var(--line);border-radius:20px;padding:1.5px 9px;margin-left:8px;vertical-align:middle;
  cursor:pointer;user-select:none;white-space:nowrap}
.verse.has-note .cmark:hover{color:var(--accent);border-color:var(--accent)}
.verse.collapsed + .notewrap{display:none}
.verse.has-note{cursor:pointer}
.verse .add{opacity:0;font-size:11px;font-family:var(--sans);vertical-align:middle;
  background:var(--accent);color:var(--on-accent);border:none;border-radius:6px;padding:2px 8px;margin-left:8px;
  cursor:pointer;transition:opacity .15s}
.verse:hover .add{opacity:.9}
.notetools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.copymenu{position:relative}
.copytrig{font-family:var(--sans);font-size:11.5px;background:var(--panel);border:1px solid var(--line);
  color:var(--soft);border-radius:20px;padding:3px 12px;cursor:pointer}
.copytrig:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.copypop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:172px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.16);padding:5px;display:none}
.copypop.show{display:block}
.copypop button{display:block;width:100%;text-align:left;font-family:var(--sans);font-size:13px;
  background:none;border:none;color:var(--scripture);border-radius:8px;padding:8px 10px;cursor:pointer}
.copypop button:hover{background:var(--accent-soft);color:var(--accent)}
.cp-sep{height:1px;background:var(--line);margin:4px 6px}
.copytrig.menu-3{width:auto;padding:7px 11px;font-size:15px;line-height:1}
.copypop-right{left:auto;right:0}
.inline-ed{width:100%;min-height:70px;font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--ink);
  background:var(--panel);border:2px solid var(--accent);border-radius:10px;padding:10px 12px;resize:vertical;outline:none}
.inline-bar{display:flex;align-items:center;gap:8px;margin-top:8px}
.inline-bar .btn{padding:5px 14px;font-size:13px}
.inline-hint{font-family:var(--sans);font-size:11px;color:var(--soft)}
/* reference commentary (Matthew Henry) — visually distinct from Nii's journal */
.refcomm{margin:14px 0 6px;border:1px solid var(--line);border-left:4px solid #6b7aa8;border-radius:10px;background:rgba(107,122,168,.05)}
.refcomm summary{cursor:pointer;padding:11px 14px;font-family:var(--sans);font-size:13.5px;font-weight:700;color:#4a5680;list-style:none}
.refcomm summary::-webkit-details-marker{display:none}
.refcomm summary::before{content:'▸ ';color:#6b7aa8}
.refcomm[open] summary::before{content:'▾ '}
.refcomm .rc-pd{font-weight:500;font-size:11px;color:var(--soft);margin-left:8px}
.refcomm-body{padding:2px 16px 14px;font-family:var(--serif);font-size:15.5px;line-height:1.6;color:var(--scripture)}
.refcomm-body .rc-p{margin:8px 0}
.refcomm-body .rc-p b{color:#4a5680;font-family:var(--sans);font-size:12px}
.verse .vcopy{background:transparent;color:var(--soft);border:1px solid var(--line)}
.verse:hover .vcopy{opacity:.9}
.verse .vcopy:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.missed{cursor:pointer}
.missed:hover{filter:brightness(.95)}
.missedpanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
.missedpanel .mp-h{font-family:var(--sans);font-size:12px;font-weight:700;color:#c0392b;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(192,57,43,.06)}
.missedrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.missedrow:last-child{border-bottom:none}
.missedrow:hover{background:var(--accent-soft)}
.missedrow .md-day{font-family:var(--sans);font-weight:700;font-size:13px;min-width:66px;color:var(--accent)}
.missedrow .md-ref{font-size:14px;color:var(--scripture)}
.missedrow .md-chev{margin-left:auto;color:var(--soft)}
.catchbtn{font-family:var(--sans);font-size:12px;font-weight:700;background:var(--accent);color:var(--on-accent);border:none;border-radius:20px;padding:5px 13px;cursor:pointer}
.catchbtn:hover{filter:brightness(1.05)}
.anchorreset{font-family:var(--sans);font-size:11.5px;color:var(--soft);background:none;border:none;text-decoration:underline;cursor:pointer}
.ed-opts{display:flex;align-items:center;gap:12px;margin-top:8px;font-family:var(--sans);font-size:12px;color:var(--soft);flex-wrap:wrap}
.ed-opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
.ed-hint{font-size:11px;opacity:.8}
.ed-spell{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-height:88px;overflow-y:auto}
.ed-spell .es-lbl{font-family:var(--sans);font-size:11px;font-weight:700;color:#c0392b}
.ed-spell .es-chip{font-family:var(--sans);font-size:12.5px;color:#c0392b;background:rgba(192,57,43,.08);
  border:1px solid rgba(192,57,43,.35);border-radius:20px;padding:2px 10px;cursor:pointer;
  text-decoration:underline;text-decoration-style:wavy;text-decoration-color:#c0392b}
.ed-spell .es-chip:hover{background:rgba(192,57,43,.16)}
.chapindex{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 22px}
.chapindex .lbl-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chapindex .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent);font-weight:700}
.chapindex .ci-toggle{margin-left:auto;font-family:var(--sans);font-size:12px;font-weight:600;
  border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:20px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.chapindex .ci-toggle:hover{background:var(--accent);color:var(--on-accent)}
.chapindex .chips{display:flex;flex-wrap:wrap;gap:6px}
.chapindex .chip{font-size:12.5px;font-family:var(--sans);background:var(--accent-soft);color:var(--accent);
  border:1px solid var(--note-line);border-radius:20px;padding:3px 11px;cursor:pointer;font-weight:600}
.chapindex .chip:hover{background:var(--accent);color:var(--on-accent)}

.note{background:var(--note-bg);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;
  margin:10px 0 16px;padding:14px 16px;box-shadow:var(--shadow);font-family:var(--sans);font-size:calc(1em*var(--fs,1))}
.note .meta{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.note .vref{font-size:12px;font-weight:700;color:var(--accent);font-family:var(--sans)}
.note .badge{font-size:10px;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:20px;font-weight:600}
.note .date{font-size:11px;color:var(--soft);margin-left:auto}
.note .body{font-size:15px;line-height:1.62;white-space:pre-wrap;word-wrap:break-word}
.note .tools{display:flex;gap:10px;margin-top:9px}
.note .tools button{background:transparent;border:none;color:var(--soft);font-size:12px;padding:0}
.note .tools button:hover{color:var(--accent)}

.navbtns{display:flex;justify-content:space-between;margin:36px auto 0;max-width:760px;gap:10px}
.navbtns button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;
  padding:12px 18px;font-size:14px;flex:1;transition:.15s}
.navbtns button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.navbtns button:disabled{opacity:.35;cursor:default}

/* My Commentary view */
.mc-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.mc-head h2{font-family:var(--serif);font-size:26px;margin:0}
.mc-count{color:var(--soft);font-size:13px;flex-basis:100%}
.mine-seg{max-width:320px;margin-left:auto}
.mc-ed{font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--accent);
  background:var(--accent-soft);border-radius:20px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.mc-book{margin-bottom:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.mc-book>summary{padding:14px 16px;font-family:var(--serif);font-size:17px;font-weight:600;cursor:pointer;
  list-style:none;display:flex;justify-content:space-between;align-items:center}
.mc-book>summary::-webkit-details-marker{display:none}
.mc-book>summary .n{font-size:12px;color:var(--soft);font-family:var(--sans);font-weight:400}
.mc-item{padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.mc-item:hover{background:var(--accent-soft)}
.mc-item .r{font-size:12.5px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}
.mc-item .mc-date{font-weight:400;color:var(--soft);font-size:11px}
.mc-item .mc-open{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--soft);
  font-size:11px;border-radius:6px;padding:3px 8px;font-weight:600}
.mc-item .mc-open:hover{border-color:var(--accent);color:var(--accent)}
.mc-item .t{font-size:13.5px;color:var(--soft);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.mc-item.open .t{-webkit-line-clamp:unset;display:block;color:var(--ink);font-size:14.5px;line-height:1.6}
/* scripture-only reading mode (hide all commentary) — but keep the chapter jump bar visible */
html.hide-notes .note, html.hide-notes .notewrap{display:none}
html.hide-notes .verse.revealed + .notewrap,
html.hide-notes .verse.revealed + .notewrap .note{display:block}   /* tap a verse to reveal its notes even when globally hidden */
/* date visibility toggle */
.note .date{display:none}
html.show-dates .note .date{display:inline}
.mc-item .mc-date{display:none}
html.show-dates .mc-item .mc-date{display:inline}

/* Chronological plan */
.planpage{max-width:680px}
.planbanner{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:var(--on-accent);border-radius:16px;padding:26px 22px;margin:0 0 18px;text-align:center;box-shadow:var(--shadow)}
.planbanner .pb-kick{font-size:12px;font-weight:800;letter-spacing:4px;opacity:.9}
.planbanner .pb-title{font-family:var(--serif);font-size:32px;font-weight:800;margin:4px 0 6px;line-height:1}
.planbanner .pb-sub{font-size:13.5px;opacity:.95}
.planprog{margin:0 0 14px}
.planbar{height:10px;background:var(--line);border-radius:20px;overflow:hidden}
.planfill{height:100%;background:var(--accent);transition:width .3s}
.planprogtxt{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft);margin-top:8px;flex-wrap:wrap}
.placebar{font-size:13px;color:var(--ink);background:var(--accent-soft);border:1px solid var(--note-line);border-radius:10px;padding:10px 14px;margin:0 0 12px}
/* horizontal day strip */
.daystrip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin;scroll-snap-type:x proximity}
.daystrip::-webkit-scrollbar{height:8px}
.daystrip::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px}
.daychip{flex:0 0 auto;width:62px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:9px 4px;text-align:center;cursor:pointer;scroll-snap-align:center}
.daychip .dn{font-size:16px;font-weight:800;color:var(--ink)}
.daychip .dl{font-size:9.5px;color:var(--soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daychip.done .dn{color:var(--accent)}
.daychip.done{background:var(--accent-soft);border-color:var(--note-line)}
.daychip.sel{border:2px solid var(--accent);background:var(--accent-soft)}
.daychip.today{border:2px solid var(--ink)}
.daychip.today .dl{background:var(--ink);color:var(--bg);border-radius:20px;padding:1px 6px;font-weight:700}
.daychip{width:66px}
.missed{font-size:11.5px;font-weight:700;color:#c0392b;background:rgba(192,57,43,.1);border-radius:20px;padding:2px 9px}
.todaypill{font-size:11px;background:var(--ink);color:var(--bg);border-radius:20px;padding:1px 9px;font-weight:700;vertical-align:middle}
/* selected reading */
.plandayhead{font-family:var(--serif);font-size:20px;margin:18px 0 12px}
.planend{font-family:var(--sans);font-size:12.5px;color:var(--soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.planend b{color:var(--accent)}
/* Day-complete celebration card */
.complete-ov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(20,16,10,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.complete-ov.show{opacity:1;pointer-events:auto}
.complete-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;max-width:440px;width:88%;
  padding:34px 30px 30px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35);
  transform:scale(.9) translateY(12px);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.complete-ov.show .complete-card{transform:none}
.complete-seal{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
  font-size:32px;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  box-shadow:0 8px 22px rgba(var(--accent-rgb),.45);animation:sealPop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes sealPop{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
.complete-kick{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--accent);margin-bottom:4px}
.complete-title{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--ink);margin-bottom:16px}
.complete-verse{font-family:var(--serif);font-size:17px;font-style:italic;line-height:1.6;color:var(--scripture);margin:0 auto 8px;max-width:360px}
.complete-ref{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--soft);margin-bottom:22px}
.complete-actions{display:flex;flex-direction:column;gap:9px;align-items:center}
.complete-go{padding:11px 26px;font-size:15px}
.complete-done{padding:9px 20px;font-size:13.5px;color:var(--soft)}
.complete-fin{font-family:var(--serif);font-size:15px;color:var(--accent);margin-bottom:6px}
/* compare-one-verse modal */
.cvcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:620px;width:92%;
  max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.35);
  transform:scale(.94);transition:transform .28s}
.complete-ov.show .cvcard{transform:none}
.cvhead{font-family:var(--serif);font-size:18px;padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cvhead b{color:var(--accent)}
.cvclose{margin-left:auto;background:none;border:none;font-size:18px;color:var(--soft);cursor:pointer}
.cvbody{overflow-y:auto;padding:6px 20px}
.cvrow{padding:12px 0;border-bottom:1px solid var(--line)}
.cvrow:last-child{border-bottom:none}
.cvver{font-family:var(--sans);font-size:12px;font-weight:800;color:var(--accent)}
.cvver span{font-weight:500;color:var(--soft);margin-left:8px}
.cvtxt{font-family:var(--serif);font-size:16.5px;line-height:1.6;color:var(--scripture);margin-top:4px}
.cvfoot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.passlist{margin:0 0 18px}
.passrow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.passchk{font-size:18px;cursor:pointer;user-select:none}
.passmain{flex:1;min-width:0;cursor:pointer}
.passref{font-family:var(--serif);font-size:17px;color:var(--ink)}
.passrow.done .passref{color:var(--soft);text-decoration:line-through}
.passchev{color:var(--soft);font-size:22px;cursor:pointer}
.planstart{width:100%;padding:15px;font-size:16px;border-radius:30px}
.plannext{width:100%;margin-top:8px}
.planjump{display:flex;gap:8px;margin-top:10px}
.planjump .btn{flex:1}
.restday{background:var(--note-bg);border:1px solid var(--note-line);border-radius:12px;padding:16px 18px;font-size:15px;color:var(--ink)}
.donepill{font-size:11px;background:var(--accent);color:var(--on-accent);border-radius:20px;padding:1px 9px;font-weight:700;vertical-align:middle}
/* plan context bar in the reader */
.planctx{background:var(--accent-soft);border:1px solid var(--note-line);border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.planctx .btn{margin-left:auto;padding:5px 12px;font-size:12.5px}
/* reader footer navigation — a real bottom bar that never covers text */
.readfoot{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.readnav{display:flex;gap:10px;align-items:center;padding:12px 20px;max-width:1080px;margin:0 auto}
.readnav button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;flex:1;cursor:pointer}
.readnav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.readnav button:disabled{opacity:.35;cursor:default}
.readnav .rn-mid{flex:0 0 auto;font-size:12.5px;color:var(--soft);font-weight:700}
.readnav .rn-next{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.readnav.planmode button.rn-next:hover{color:var(--on-accent);opacity:.92}
/* compare two versions */
.cmpwrap{max-width:820px}
.cmprow{display:grid;grid-template-columns:28px 1fr 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:16px;line-height:1.6}
.cmprow .cmpv{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--accent);padding-top:4px}
.cmpcol.cmpb{color:var(--soft)}
@media(max-width:700px){.cmprow{grid-template-columns:24px 1fr}.cmprow .cmpb{grid-column:2;border-top:1px dashed var(--line);padding-top:6px}}
/* Search results */
.sr-item{padding:12px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.sr-item:hover{border-color:var(--accent)}
.sr-item .r{font-size:12.5px;font-weight:700;color:var(--accent)}
.sr-item .t{font-size:14px;margin-top:3px}
.sr-item mark{background:var(--note-line);color:inherit;padding:0 2px;border-radius:3px}
.sr-tag{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--soft);margin-left:6px}

/* Welcome / About */
.about{max-width:680px}
.about-hero{text-align:center;padding:18px 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px}
.about-kicker{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
.about-title{font-family:var(--serif);font-size:32px;font-weight:600;margin:10px 0 16px;line-height:1.2}
.about-slogan{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.6;color:var(--soft);max-width:560px;margin:0 auto}
.about-listen{margin:16px auto 0}
.about-listen .btn{border-color:var(--accent);color:var(--accent)}
.about-lead{font-family:var(--serif);font-size:22px;line-height:1.5;font-weight:600;margin:0 0 18px}
.about-p{font-family:var(--serif);font-size:17.5px;line-height:1.75;margin:0 0 18px;color:var(--scripture)}
.about-sign{font-family:var(--serif);font-size:19px;font-weight:600;margin:26px 0 0}
.about-cta{margin:28px 0 10px;display:flex;gap:10px;flex-wrap:wrap}
.about-firsttime{background:var(--accent-soft);border:1px solid var(--note-line);border-radius:10px;
  padding:12px 15px;font-family:var(--sans);font-size:14px;color:var(--accent);font-weight:600;margin:0 0 22px}
.about-reward{background:var(--note-bg);border:1px dashed var(--note-line);border-radius:12px;
  padding:14px 16px;font-family:var(--sans);font-size:14.5px;color:var(--ink);margin:18px 0 4px}
.about-reward b{color:var(--accent)}
.howto{margin:34px 0 0;border-top:1px solid var(--line);padding-top:22px}
.howto h3{font-family:var(--serif);font-size:20px;margin:0 0 12px}
.howto ul{margin:0;padding-left:20px;font-family:var(--sans)}
.howto li{font-size:15px;line-height:1.65;margin-bottom:10px;color:var(--ink)}
.howto b{color:var(--accent)}

/* Editor modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;
  justify-content:center;padding:20px;z-index:50}
.overlay.show{display:flex}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:600px;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal h3{font-family:var(--serif);margin:0;font-size:20px}
.modal .mh{padding:18px 20px 8px}
.modal .mh .vtext{font-family:var(--serif);font-size:15px;color:var(--soft);margin-top:8px;
  background:var(--bg);padding:10px 12px;border-radius:8px;line-height:1.5;max-height:120px;overflow:auto}
.modal .mb{padding:6px 20px 0;flex:1;overflow:auto}
.modal textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;padding:13px;
  font-size:15px;font-family:var(--sans);line-height:1.6;color:var(--ink);background:var(--bg);resize:vertical}
.modal .mf{padding:16px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);margin-top:14px}
.btn{border-radius:9px;padding:10px 18px;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.danger{color:#c0392b;border-color:transparent}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:11px 20px;border-radius:30px;font-size:13.5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.show{opacity:1}
.unsaved-dot{display:inline-block;width:8px;height:8px;background:#e0a020;border-radius:50%;margin-left:5px;vertical-align:middle}

.updbar{position:fixed;left:12px;right:12px;bottom:14px;z-index:200;background:var(--accent);color:var(--on-accent);
  border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 6px 24px rgba(0,0,0,.3);font-family:var(--sans);font-size:14px;font-weight:600}
.updbar button{background:var(--on-accent);color:var(--accent);border:none;border-radius:20px;padding:6px 14px;font-weight:700;cursor:pointer;font-family:inherit}
.updbar .upd-btn{margin-left:auto}
.updbar .upd-x{background:transparent;color:var(--on-accent);font-size:16px;padding:2px 6px}
.empty{text-align:center;color:var(--soft);padding:60px 20px}
.empty .big{font-size:40px;margin-bottom:10px}

/* ---------- New UI: bottom nav, home feed, discourse, menu ---------- */
.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);
  border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08);
  padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;background:transparent;border:none;color:var(--soft);font-family:var(--sans);
  font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
.bottomnav button span{font-size:19px;line-height:1}
.bottomnav button.active{color:var(--accent)}
#tabsLegacy{display:none}
body.legacy #tabsNew{display:none}
body.legacy #tabsLegacy{display:flex}
body.legacy .bottomnav{display:none!important}
/* New UI hides the sidebar on every screen — navigation lives in the bottom bar (mobile-style) */
body:not(.legacy) .sidebar,body:not(.legacy) .resizer,body:not(.legacy) .backdrop,body:not(.legacy) .menu-btn{display:none!important}
body:not(.legacy) .bottomnav{display:flex;justify-content:center}
body:not(.legacy) .bottomnav button{max-width:120px}
body:not(.legacy) .main{padding-bottom:54px}
.uiswitch{width:100%;font-size:11.5px;padding:6px;border:1px dashed var(--line);background:transparent;color:var(--soft);border-radius:8px;cursor:pointer;font-family:var(--sans)}
.uiswitch:hover{color:var(--accent);border-color:var(--accent)}
.homefeed{max-width:720px;margin:0 auto}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);font-family:var(--sans)}
.hcard.hero{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);color:var(--on-accent);border:none}
.hcard.hero h2{font-family:var(--serif);margin:6px 0 8px;font-size:22px}
.hcard.hero .hq{font-style:italic;opacity:.92;margin:0 0 12px}
.hcard.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:var(--on-accent)}
.hcard .hk{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:var(--accent);margin-bottom:6px}
.hcard.hero .hk{color:var(--on-accent);opacity:.85}
.hcard h3{font-family:var(--serif);margin:0 0 6px;font-size:18px}
.hcard .soft{color:var(--soft);font-size:13px;margin:0 0 10px}
.hcard .hrow{display:flex;gap:8px;flex-wrap:wrap}
.hverse{font-family:var(--serif);font-size:17px;line-height:1.55;margin:6px 0 8px}
.hnote{background:var(--note-bg);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 8px 8px 0;font-size:13.5px;margin:0 0 12px}
.href{font-weight:700;color:var(--accent);font-size:13px}
.coming{text-align:center;padding:40px 16px;font-family:var(--sans)}
.coming .big{font-size:52px}
.coming h2{font-family:var(--serif);font-size:28px;margin:10px 0 6px}
.soon-badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:3px 14px;font-size:12px;font-weight:700;margin-bottom:14px}
.coming p{max-width:520px;margin:0 auto 12px;line-height:1.6}
.menulist{max-width:640px;margin:0 auto;font-family:var(--sans)}
.mitem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.mitem:hover{border-color:var(--accent)}
.mitem .mi{font-size:22px;color:var(--accent);display:inline-flex}
.mitem .mi svg{width:22px;height:22px}
.mitem .mt{font-weight:700}
.mitem .md{font-size:12.5px;color:var(--soft)}
.mitem .chev{margin-left:auto;color:var(--soft)}
.mitem .soon{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:2px 8px;white-space:nowrap}
.about-skiptop{font-size:12.5px}
.kpara{transition:opacity .35s ease,background-color .35s ease;border-radius:6px}
.kpara.done{opacity:.5}
.kpara.cur{background-color:rgba(234,179,8,.16);opacity:1}
.skipov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.skipcard{background:var(--panel);border-radius:18px;padding:26px 22px;max-width:380px;text-align:center;font-family:var(--sans);box-shadow:var(--shadow)}
.skipcard h3{font-family:var(--serif);font-size:22px;margin:8px 0 8px}
.skipcard p{color:var(--soft);font-size:14px;line-height:1.55;margin:0 0 16px}
.skipcard .btn{display:block;width:100%;margin-bottom:8px}
.skipcard .skipdim{border:none;color:var(--soft);font-size:12.5px}
/* verse highlights */
.verse.hl-y{background:rgba(250,204,21,.28)}
.verse.hl-g{background:rgba(74,222,128,.26)}
.verse.hl-b{background:rgba(96,165,250,.26)}
.verse.hl-p{background:rgba(244,114,182,.26)}
.verse.reading{outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-soft)}
.hlrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.hlbl{font-size:11px;color:var(--soft);font-family:var(--sans);font-weight:600}
.hld{width:20px;height:20px;border-radius:50%;cursor:pointer;border:1.5px solid rgba(0,0,0,.15);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--soft)}
.hd-y{background:#facc15}.hd-g{background:#4ade80}.hd-b{background:#60a5fa}.hd-p{background:#f472b6}
.hd-x{background:var(--bg);border:1.5px dashed var(--line)}
/* reader toolbar + text size */
.rtools{display:flex;gap:8px;justify-content:center;align-items:center;margin:10px 0 16px;flex-wrap:wrap}
.rtools .btn{padding:6px 14px;font-size:13px}
.rtools .vsel{padding:6px 8px;font-size:13px;max-width:170px;cursor:pointer}
.seasontag{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;
  background:var(--note-line,rgba(140,110,60,.18));color:var(--soft);font-size:10.5px;
  font-family:var(--sans);letter-spacing:.02em;text-transform:none;vertical-align:middle}
/* weekly topical plans */
.topsec{margin-top:26px;font-family:var(--sans)}
.topsec-h{font-family:var(--serif);font-size:20px;margin:0 0 12px}
.topgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.topcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.topcard:hover{border-color:var(--accent)}
.tc-t{font-family:var(--serif);font-size:19px;font-weight:700}
.tc-d{font-size:11.5px;color:var(--soft);margin:3px 0 10px;min-height:28px}
.tc-p{height:5px;background:var(--accent-soft);border-radius:3px;overflow:hidden}
.tc-p div{height:100%;background:var(--accent)}
.tc-n{font-size:11px;color:var(--soft);margin-top:5px}
.toprow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-family:var(--sans)}
.topchk{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--on-accent);font-weight:700;flex-shrink:0}
.topchk.on{background:var(--accent)}
.toprow-main{flex:1;cursor:pointer}
.tr-day{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--soft);font-weight:700}
.tr-ref{font-family:var(--serif);font-size:17px}
.crumb{cursor:pointer}
.crumb .caret{font-size:11px;color:var(--soft)}
.bp-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80}
.bp-ov.show{display:flex}
.bp-sheet{background:var(--panel);width:min(480px,100%);margin:auto auto 0;max-height:86vh;display:flex;flex-direction:column;
  border-radius:18px 18px 0 0;padding:14px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@media(min-width:861px){.bp-sheet{margin:auto;border-radius:18px;max-height:80vh}}
.bp-head{display:flex;align-items:center;margin-bottom:8px;font-weight:700;font-family:var(--sans)}
.bp-head span{flex:1;text-align:center}
.bp-x{background:var(--bg);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;color:var(--ink);cursor:pointer}
.bp-list{overflow:auto;flex:1;min-height:200px}
.bp-book{padding:11px 6px;font-family:var(--serif);font-size:18px;cursor:pointer;border-bottom:1px solid var(--line)}
.bp-book.cur{color:var(--accent);font-weight:700}
.bp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:10px 2px 14px;border-bottom:1px solid var(--line)}
.bp-grid button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 0;font-size:15px;color:var(--ink);cursor:pointer;font-family:var(--sans)}
.bp-grid button.cur{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bp-foot{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:10px;font-family:var(--sans)}
.bp-foot button{flex:1;padding:8px;border:none;background:transparent;color:var(--ink);cursor:pointer;font-weight:600}
.bp-foot button.on{background:var(--accent-soft);color:var(--accent)}
#chapselWrap{display:none!important}
/* reading controls appear only in Bible reading & search */
body[data-view]:not([data-view="read"]):not([data-view="search"]) .rc{display:none!important}
#searchBtn,#tbMore{display:none}
@media(max-width:860px){
  body.legacy .menu-btn{display:block}
  .searchwrap{display:none}
  .topbar.searching .searchwrap{display:flex;flex:1 1 100%;order:10}
  body[data-view="search"] .searchwrap{display:flex;flex:1 1 100%;order:10}
  #cmpBtn,#refBtn,#themeBtn{display:none}
  body[data-view="read"] #searchBtn,body[data-view="search"] #searchBtn,
  body[data-view="read"] #tbMore,body[data-view="search"] #tbMore{display:flex}
  .versel{max-width:84px}
}
.disc-input{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:14px;padding:10px 12px;margin-bottom:10px;resize:vertical}
.qotd-empty{border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--soft);font-size:13px}
.streakrow{display:flex;gap:10px;text-align:center}
.streakrow>div{flex:1;background:var(--accent-soft);border-radius:12px;padding:10px 6px}
.streakrow b{display:block;font-size:22px;color:var(--accent)}
.streakrow span{font-size:11px;color:var(--soft)}
.nico{display:inline-flex;align-items:center;justify-content:center}
.nico svg{width:22px;height:22px}
.hk .nico{vertical-align:-4px;margin-right:5px}
.hk .nico svg{width:15px;height:15px}
.cmark .nico{vertical-align:-2px;margin-right:3px}
.cmark .nico svg{width:13px;height:13px}
.icon-btn .nico svg{width:18px;height:18px}

/* Mobile */
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
@media(max-width:860px){
  .sidebar{position:fixed;z-index:40;height:100%;margin-left:-300px;box-shadow:var(--shadow)}
  .sidebar.open{margin-left:0}
  .backdrop.show{display:block}
  .topbar{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .searchwrap{flex:1;min-width:0}
  .searchwrap input{width:100%;min-width:70px}
  .versel{max-width:110px}
  .icon-btn{width:34px;height:34px;font-size:15px}
  .chapindex{padding:10px 12px;margin-bottom:16px}
  .chapindex .lbl-row{flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .chapindex .lbl{font-size:10px;letter-spacing:.5px}
  .chapindex .ci-toggle{font-size:11px;padding:3px 9px}
  .chapindex .chips{gap:5px}
  .chapindex .chip{font-size:12px;padding:2px 9px}
  .bottomnav{display:flex}
  .main{padding-bottom:54px}
  .crumb{font-size:16px}
  .reader{padding:22px 12px 120px}
  .chap-title{font-size:25px}
  .verse{font-size:calc(18px*var(--fs,1))}
  .resizer{display:none}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-top">
        <div class="copymenu">
          <button class="copytrig menu-3" onclick="toggleCopyMenu(event,this)" title="Menu — backup / restore your notes">☰</button>
          <div class="copypop">
            <button onclick="closeCopyMenus();exportCommentary()">⬆ Export a backup</button>
            <button onclick="closeCopyMenus();document.getElementById('importFile').click()">⬇ Import a backup</button>
          </div>
        </div>
      </div>
      <h1>Never Get Bored</h1>
      <p>Nii Okai's Journal Through Scripture</p>
      <div class="ver" id="ver"></div>
    </div>
    <div class="side-actions tabs" id="tabsNew">
      <button data-view="home" onclick="setView('home')">Home</button>
      <button data-view="read" onclick="setView('read')">Bible</button>
      <button data-view="plan" onclick="setView('plan')">Plan</button>
      <button data-view="discourse" onclick="setView('discourse')">Discourse</button>
      <button data-view="menu" onclick="setView('menu')">Menu</button>
    </div>
    <div class="side-actions tabs" id="tabsLegacy">
      <button data-view="about" onclick="setView('about')">Welcome</button>
      <button data-view="read" onclick="setView('read')">Read Bible</button>
      <button data-view="mine" onclick="setView('mine')">Journal</button>
      <button data-view="plan" onclick="setView('plan')">Plan</button>
    </div>
    <div class="side-actions">
      <button class="uiswitch" id="uiSwitch" onclick="toggleLegacy()">🖥 Legacy UI</button>
    </div>
    <div class="side-actions" id="previewRow" style="border-top:none;padding-top:0">
      <button id="previewBtn" onclick="togglePreview()" title="See the app the way a public reader sees it" style="flex:1 1 100%">👁 Preview as a reader</button>
    </div>
    <div class="lib-section">
      <div class="lib-head">Library <span>reference works · shown while you read</span></div>
      <button id="refToggleBtn" class="lib-item" onclick="toggleRefComm()">
        <span class="lib-name">📖 Matthew Henry’s Commentary</span>
        <span class="lib-state" id="refState">Off</span>
      </button>
    </div>
    <div class="booklist" id="booklist"></div>
  </aside>
  <div class="resizer" id="resizer" title="Drag to resize the sidebar"></div>
  <div class="backdrop" id="backdrop" onclick="toggleSidebar(false)"></div>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
      <button class="icon-btn" id="planBackBtn" onclick="exitPlanRead()" title="Back to the plan" style="display:none">←</button>
      <span class="crumb" id="crumb" onclick="if(state.view==='read')openBookPicker()">Genesis 1</span>
      <div class="chapsel" id="chapselWrap">
        <select id="chapSelect" onchange="goChapter(+this.value)"></select>
      </div>
      <div class="spacer"></div>
      <div class="searchwrap rc">
        <input id="search" placeholder="Search…" oninput="onSearch(this.value)" autocomplete="off">
      </div>
      <button class="icon-btn rc" id="searchBtn" data-ico="search" onclick="tbSearch()" title="Search"></button>
      <select class="versel rc" id="verSelect" onchange="setVersion(this.value)" title="Translation"></select>
      <select class="versel rc" id="cmpSelect" onchange="setCompare(this.value)" title="Compare with…" style="display:none"></select>
      <button class="icon-btn rc" id="cmpBtn" onclick="toggleCompare()" title="Compare two translations side by side">⇄</button>
      <button class="icon-btn rc" id="notesBtn" onclick="toggleNotes()" title="Show ALL of Nii Okai’s commentary / hide all (scripture only)">💬</button>
      <button class="icon-btn rc" id="refBtn" onclick="toggleRefComm()" title="Show / hide Matthew Henry's classic commentary (public domain)">📚</button>
      <button class="icon-btn rc" id="dateBtn" onclick="toggleDates()" title="Show / hide the dates notes were written" style="display:none">📅</button>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">☾</button>
      <button class="icon-btn rc" id="tbMore" data-ico="dots" onclick="tbMoreMenu(event)" title="More"></button>
    </div>
    <div class="reader" id="reader"></div>
    <div class="readfoot" id="readfoot" style="display:none"></div>
  </main>
</div>

<div class="bp-ov" id="bpOv" onclick="if(event.target===this)closeBookPicker()">
  <div class="bp-sheet">
    <div class="bp-head"><button class="bp-x" onclick="closeBookPicker()">✕</button><span>Books</span><span style="width:32px"></span></div>
    <div class="bp-list" id="bpList"></div>
    <div class="bp-foot"><button id="bpTrad" class="on" onclick="bpOrder('trad')">Traditional</button><button id="bpAlpha" onclick="bpOrder('alpha')">Alphabetical</button></div>
  </div>
</div>

<button class="fabnotes" id="fabNotes" onclick="toggleNotes()">Hide all commentary</button>
<nav class="bottomnav" id="bottomnav">
  <button data-view="home" data-ico="home" onclick="setView('home')">Home</button>
  <button data-view="plan" data-ico="cal" onclick="setView('plan')">Plans</button>
  <button data-view="read" data-ico="book" onclick="setView('read')">Bible</button>
  <button data-view="discourse" data-ico="chat" onclick="setView('discourse')">Discourse</button>
  <button data-view="menu" data-ico="menu" onclick="setView('menu')">Menu</button>
</nav>

<input type="file" id="importFile" accept=".json,.js" style="display:none" onchange="importCommentary(event)">

<!-- EDITOR -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mh">
      <h3 id="edTitle">Add commentary</h3>
      <div class="vtext" id="edVerse"></div>
    </div>
    <div class="mb">
      <textarea id="edText" placeholder="Share your thoughts on this verse…" spellcheck="true" autocapitalize="sentences" autocorrect="on" oninput="noteAutocorrect(event)"></textarea>
      <div class="ed-opts"><label title="Fixes obvious typos & capitalisation as you type — leaves your spelling & style alone"><input type="checkbox" id="edAuto" checked> Auto-correct</label>
        <span class="ed-hint">Flagged words show below — click one to fix, ignore, or add to your dictionary</span></div>
      <div class="ed-spell" id="edSpell" style="display:none"></div>
    </div>
    <div class="mf">
      <button class="btn danger" id="edDelete" onclick="deleteCurrent()" style="margin-right:auto;display:none">Delete</button>
      <button class="btn" onclick="closeEditor()">Cancel</button>
      <button class="btn primary" onclick="saveEditor()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- DATA -->
<script src="data/books.js"></script>
<script src="data/versions.js"></script>
<script src="data/commentary.js"></script>
<script src="data/refined.js"></script>
<script src="data/chronological.js"></script>
<script src="data/audio_kjv.js"></script>
<script src="data/audio_kokoro.js" onerror="window.AUDIO_KOKORO=null"></script>

<script>
/* ---------- State ---------- */
const LS_KEY='henry_bible_commentary_v1';
const LS_PREFS='henry_bible_prefs_v1';
const BUILD={v:'0.52.0', date:'21 Aug 2026'};
const BLOG_URL='https://www.getwordwisdom.com/';
const OWNER_KEY='niiokai';
function isOwner(){ try{ return localStorage.getItem('nok_owner')==='1'; }catch(e){ return false; } }
let state={version:'KJV',book:0,chapter:1,view:'home',dirty:false,journal:'modern',plan:null,compare:null,refcomm:false};
let _refTried={};
let DATA={};            // working commentary
let editing=null;       // {book,ch,v,id}

/* ---------- Init ---------- */
function init(){
  // owner unlock via secret link (?owner=<key>); everyone else sees the reader view
  try{ const q=new URLSearchParams(location.search);
    if(q.get('owner')===OWNER_KEY){ localStorage.setItem('nok_owner','1'); history.replaceState(null,'',location.pathname); toast('Owner mode unlocked on this device'); }
    else if(q.get('owner')==='off'){ localStorage.removeItem('nok_owner'); history.replaceState(null,'',location.pathname); }
  }catch(e){}
  document.body.classList.toggle('is-reader',!isOwner());
  // first-time readers: the year plan begins at Day 1 TODAY (not the calendar), so no "missed days" on arrival
  try{ if(!localStorage.getItem('nok_plan_anchor') && !Object.keys(chDone()).length){
    const n=new Date(); const iso=new Date(n.getFullYear(),n.getMonth(),n.getDate()).toISOString().slice(0,10);
    localStorage.setItem('nok_plan_anchor',JSON.stringify({day:0,date:iso})); } }catch(e){}
  applyFont();
  // load commentary: localStorage overrides seed
  try{ const s=localStorage.getItem(LS_KEY); DATA=s?JSON.parse(s):deepCopy(window.COMMENTARY_SEED||{}); }
  catch(e){ DATA=deepCopy(window.COMMENTARY_SEED||{}); }
  // prefs
  try{ const p=JSON.parse(localStorage.getItem(LS_PREFS)||'{}');
    if(p.version&&window.VERSIONS[p.version]) state.version=p.version;
    if(typeof p.book==='number') state.book=p.book;
    if(typeof p.chapter==='number') state.chapter=p.chapter;
    if(p.theme) document.documentElement.dataset.theme=p.theme;
    if(p.showDates){ document.documentElement.classList.add('show-dates'); }
    if(p.hideNotes===true){ document.documentElement.classList.add('hide-notes'); } // default: MY journal is shown
    if(p.journal==='original'||p.journal==='modern') state.journal=p.journal;
    if(p.refcomm) state.refcomm=true;
    if(['read','plan','home','discourse','menu','mine'].includes(p.view)) state.view=p.view;
    if(p.plan&&typeof p.plan.day==='number') state.plan=p.plan;
    if(p.planResume&&typeof p.planResume.day==='number') planResume=p.planResume;
    if(typeof p.planSel==='number') planSel=p.planSel;
  }catch(e){}
  if(state.refcomm){ ensureRefIndex(()=>{}); } _syncRefUI();
  document.getElementById('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾';
  document.getElementById('dateBtn').classList.toggle('active',document.documentElement.classList.contains('show-dates'));
  if(localStorage.getItem('nok_dates_unlocked')) document.getElementById('dateBtn').style.display='';
  { const off=document.documentElement.classList.contains('hide-notes');
    const nb=document.getElementById('notesBtn'); nb.classList.toggle('active',!off); }
  // first-visit welcome gate
  if(!localStorage.getItem('nok_seen_welcome')){ state.gate=true; state.view='about'; }
  // legacy UI preference
  if(localStorage.getItem('nok_legacy')){ document.body.classList.add('legacy');
    const ub=document.getElementById('uiSwitch'); if(ub) ub.textContent='✨ New UI';
    if(state.view==='home') state.view='read'; }
  document.getElementById('ver').textContent='v'+BUILD.v+' · built '+BUILD.date;
  try{ const sw=localStorage.getItem('nok_sidew'); if(sw) document.getElementById('sidebar').style.width=sw+'px'; }catch(e){}
  setupResizer();
  _trackStreak();
  document.querySelectorAll('[data-ico]').forEach(b=>{ b.insertAdjacentHTML('afterbegin',ICONS[b.dataset.ico]); });
  document.getElementById('notesBtn').innerHTML=ICONS.chat;
  document.getElementById('refBtn').innerHTML=ICONS.library;
  document.getElementById('cmpBtn').innerHTML=ICONS.swap;
  setViewTabs();
  buildVersionSelect();
  buildBookList();
  render();
}
function setupResizer(){
  const sb=document.getElementById('sidebar'), rz=document.getElementById('resizer'); if(!rz)return;
  let drag=false;
  rz.addEventListener('mousedown',e=>{ drag=true; rz.classList.add('dragging'); document.body.style.userSelect='none'; e.preventDefault(); });
  window.addEventListener('mousemove',e=>{ if(!drag)return; let w=Math.max(240,Math.min(480,e.clientX)); sb.style.width=w+'px'; });
  window.addEventListener('mouseup',()=>{ if(!drag)return; drag=false; rz.classList.remove('dragging'); document.body.style.userSelect='';
    try{ localStorage.setItem('nok_sidew',parseInt(sb.style.width)); }catch(e){} });
}
function enterFromWelcome(){ localStorage.setItem('nok_seen_welcome','1'); localStorage.setItem('nok_dates_unlocked','1');
  document.getElementById('dateBtn').style.display=''; state.gate=false; setView('home'); }
function skipWelcome(force){
  if(!force && !localStorage.getItem('nok_skip_nudge')){
    localStorage.setItem('nok_skip_nudge','1');
    const ov=document.createElement('div'); ov.className='skipov'; ov.id='skipov';
    ov.innerHTML=`<div class="skipcard">
      <div style="font-size:34px">🎁</div>
      <h3>Before you go…</h3>
      <p>Nii Okai wrote this welcome just for you — it changes how you’ll read everything that follows. And there’s a small gift at the end for those who finish it.</p>
      <button class="btn primary" onclick="document.getElementById('skipov').remove();karListen()">▶︎ Listen instead (3 min)</button>

/* Paragraph-by-paragraph narration highlight. Each paragraph is given a share of
   the recording proportional to how many words it contains, which tracks natural
   speech far better than splitting the time evenly across every word. The page
   markup is left untouched, so italics inside the text survive. */
/* Measured from the recording itself (silence analysis of audio/welcome.mp3):
   the second at which each block actually begins. Exact, not estimated.
   If the recording is ever replaced, the length check below fails and it
   quietly falls back to the word-weighted estimate. */
const KAR_TIMES=[0.46,10.35,17.35,49.40,82.41,110.16,149.20,175.81,180.66];
const KAR_AUDIO_LEN=186.51, KAR_LEAD=0.25;
let _karEls=null,_karW=null,_karTotal=0,_karLast=-1;
function _karPrep(){
  _karEls=[...document.querySelectorAll('.about-slogan,.about-lead,.about-p')];
  _karEls.forEach(el=>el.classList.add('kpara'));
  _karW=_karEls.map(el=>Math.max(1,el.textContent.trim().split(/\s+/).filter(Boolean).length));
  _karTotal=_karW.reduce((a,b)=>a+b,0)||1;
  _karLast=-1; }
function _karClear(){ if(_karEls) _karEls.forEach(el=>el.classList.remove('cur','done')); _karLast=-1; }
function _karTick(a){
  if(!_karEls||!_karEls.length||!a.duration) return;
  let idx;
  if(_karEls.length===KAR_TIMES.length && Math.abs(a.duration-KAR_AUDIO_LEN)<1.5){
    const t=a.currentTime+KAR_LEAD; idx=0;
    for(let i=0;i<KAR_TIMES.length;i++){ if(t>=KAR_TIMES[i]) idx=i; else break; }
  } else {
    const target=_karTotal*(a.currentTime/a.duration);
    let acc=0; idx=_karEls.length-1;
    for(let i=0;i<_karEls.length;i++){ acc+=_karW[i]; if(target<acc){ idx=i; break; } }
  }
  if(idx===_karLast) return;
  _karLast=idx;
  _karEls.forEach((el,j)=>{ el.classList.toggle('cur',j===idx); el.classList.toggle('done',j<idx); });
  const cur=_karEls[idx];
  if(cur){ const r=cur.getBoundingClientRect();
    if(r.top<90||r.bottom>window.innerHeight-140) cur.scrollIntoView({behavior:'smooth',block:'center'}); } }
function _karStart(a){ if(state.view!=='about') return; _karPrep();
  a.ontimeupdate=()=>_karTick(a);
  a.addEventListener('ended',_karClear,{once:true}); }

/* Warm, congratulatory completion chime — an ascending major arpeggio that resolves into a chord.
   Bell-like (sine + soft harmonic), gentle reverb-ish tail. Purely Web Audio, no file needed. */
function playDing(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  const ac=new AC(); const t0=ac.currentTime; const master=ac.createGain();
  master.gain.value=0.9; master.connect(ac.destination);
  const bell=(freq,at,dur,vol)=>{ const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o2.type='sine'; o.frequency.value=freq; o2.frequency.value=freq*2.01; // add a shimmer harmonic
    const g2=ac.createGain(); g2.gain.value=0.28; o2.connect(g2); g2.connect(g); o.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.0001,t0+at); g.gain.exponentialRampToValueAtTime(vol,t0+at+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+at+dur);
    o.start(t0+at); o2.start(t0+at); o.stop(t0+at+dur+0.05); o2.stop(t0+at+dur+0.05); };
  // C5 E5 G5 C6 arpeggio, then a soft sustained C-major chord
  bell(523.25,0.00,0.45,0.32); bell(659.25,0.11,0.45,0.32); bell(783.99,0.22,0.5,0.34); bell(1046.5,0.33,0.9,0.4);
  bell(523.25,0.5,1.3,0.16); bell(659.25,0.5,1.3,0.14); bell(783.99,0.5,1.3,0.14);
  setTimeout(()=>{try{ac.close();}catch(e){}},2200);
}catch(e){} }

/* ---------- Conservative autocorrect (never touches British spelling / proper nouns) ---------- */
const AUTOCORRECT={teh:'the',hte:'the',adn:'and',nad:'and',thier:'their',recieve:'receive',
 becuase:'because',beacuse:'because',wich:'which',seperate:'separate',definately:'definitely',
 occured:'occurred',untill:'until',wnat:'want',taht:'that',thna:'than',wiht:'with',
 alot:'a lot',accross:'across',beleive:'believe',freind:'friend',wierd:'weird',
 dont:"don't",doesnt:"doesn't",didnt:"didn't",cant:"can't",wont:"won't",wouldnt:"wouldn't",
 couldnt:"couldn't",shouldnt:"shouldn't",isnt:"isn't",arent:"aren't",wasnt:"wasn't",
 werent:"weren't",havent:"haven't",hasnt:"hasn't",hadnt:"hadn't",im:"I'm",ive:"I've",
 youre:"you're",theyre:"they're",thats:"that's",whats:"what's"};
/* Offline spelling model: dictionary + frequency rank + your personal dictionary + learned fixes */
let _DICT=null, _RANK=null;
let _USERDICT=new Set(), _LEARN={}, _rejected=new Set(), _lastAuto=null;
function _loadUserSpell(){ try{ _USERDICT=new Set(JSON.parse(localStorage.getItem('nok_userdict')||'[]')); }catch(e){ _USERDICT=new Set(); }
  try{ _LEARN=JSON.parse(localStorage.getItem('nok_learn')||'{}'); }catch(e){ _LEARN={}; } }
function _saveUserDict(){ localStorage.setItem('nok_userdict',JSON.stringify([..._USERDICT])); }
function _saveLearn(){ localStorage.setItem('nok_learn',JSON.stringify(_LEARN)); }
function _buildDict(){ _DICT=new Set(); _RANK=new Map(); _loadUserSpell();
  const w=window.DICT_WORDS||[]; for(let i=0;i<w.length;i++){ _DICT.add(w[i]); _RANK.set(w[i],i); }
  // your own words (proper nouns, Pidgin, native expressions) count as known so we never mangle them
  try{ for(const bk in DATA)for(const c in DATA[bk])for(const v in DATA[bk][c])DATA[bk][c][v].forEach(nt=>{
    (nt.text.toLowerCase().match(/[a-z']{2,}/g)||[]).forEach(t=>{ if(!_DICT.has(t)){_DICT.add(t); _RANK.set(t,900000);} }); }); }catch(e){}
  _USERDICT.forEach(t=>{ if(!_DICT.has(t)){_DICT.add(t); _RANK.set(t,850000);} });
}
function _isKnown(w){ if(!_DICT)_buildDict(); return _DICT.has(w)||_USERDICT.has(w)||_rejected.has(w); }
const _AL="abcdefghijklmnopqrstuvwxyz";
function _edits1(w){ const res=new Set();
  for(let i=0;i<=w.length;i++){ const a=w.slice(0,i), b=w.slice(i);
    if(b) res.add(a+b.slice(1));                                   // delete
    if(b.length>1) res.add(a+b[1]+b[0]+b.slice(2));                // transpose
    for(let j=0;j<26;j++){ const c=_AL[j]; if(b) res.add(a+c+b.slice(1)); res.add(a+c+b); } // replace + insert
  } return res; }
/* candidate suggestions, best (most common) first — edit distance 1, then 2 */
function _suggest(word,max){ if(!_DICT)_buildDict(); max=max||5; const lower=word.toLowerCase();
  const cand=new Map();
  _edits1(lower).forEach(c=>{ if(_RANK.has(c)) cand.set(c,Math.min(cand.get(c)??Infinity,_RANK.get(c))); });
  if(cand.size<max){ let n=0; for(const w1 of _edits1(lower)){ if(n>3000)break;
    for(const c of _edits1(w1)){ n++; if(n>26000)break; if(_RANK.has(c)&&!cand.has(c)) cand.set(c,_RANK.get(c)); } } }
  let out=[...cand.entries()].sort((a,b)=>a[1]-b[1]).slice(0,max).map(x=>x[0]);
  const sp=_splitWord(lower); if(sp&&!out.includes(sp)) out.unshift(sp);   // offer the split too
  return out.slice(0,max); }
/* two merged words → split them ("notstated" → "not stated") */
function _splitWord(lower){ if(!_DICT)_buildDict(); if(lower.length<5) return null;
  let best=null,bestScore=Infinity;
  for(let i=2;i<=lower.length-2;i++){ const a=lower.slice(0,i), b=lower.slice(i);
    const ra=_RANK.get(a), rb=_RANK.get(b);
    if(ra!==undefined&&rb!==undefined&&ra<50000&&rb<50000){ const sc=ra+rb; if(sc<bestScore){bestScore=sc;best=a+' '+b;} } }
  return best; }
/* confident single-word auto-fix (used while typing) */
function _correct(word){ if(!_DICT)_buildDict();
  const lower=word.toLowerCase();
  if(_LEARN[lower]) return _LEARN[lower];          // something you taught me
  if(lower.length<3) return null;
  if(_isKnown(lower)) return null;
  let best=null, bestRank=Infinity;
  _edits1(lower).forEach(c=>{ const r=_RANK.get(c); if(r!==undefined && r<bestRank && r<800000){ bestRank=r; best=c; } });
  if(best) return best;
  const sp=_splitWord(lower); if(sp) return sp;     // merged-word split
  // try distance-2 only if a clearly common single candidate emerges
  const s=_suggest(lower,2); if(s.length===1 || (s.length>1 && _RANK.get(s[0])<3000)) return s[0]||null;
  return null;
}
function _applyCase(src,fixed){
  if(src===src.toUpperCase()&&src!==src.toLowerCase()) return fixed.toUpperCase();
  if(src[0]===src[0].toUpperCase()&&src[0]!==src[0].toLowerCase()) return fixed.charAt(0).toUpperCase()+fixed.slice(1);
  return fixed; }
function noteAutocorrect(e){
  const ta=e.target;
  const auto=document.getElementById('edAuto');
  const it=e.inputType; const d=e.data;
  if(!auto||!auto.checked){ scheduleSpellStrip(ta); return; }
  // (A) auto-fix just made, user hit Backspace → undo it and remember not to re-correct (your "retype leaves it")
  if(_lastAuto && it && it.indexOf('delete')===0){
    const {from,to,start}=_lastAuto; const val=ta.value;
    if(val.slice(start,start+to.length)===to){                  // corrected word still intact, they backspaced the space after it
      ta.value=val.slice(0,start)+from+val.slice(start+to.length);
      ta.selectionStart=ta.selectionEnd=start+from.length;
      _rejected.add(from.toLowerCase()); _lastAuto=null; scheduleSpellStrip(ta); return; }
    _lastAuto=null;
  }
  if(it==='insertText' && d && !/[\s.!?,;:]/.test(d)) _lastAuto=null;   // typing a new word — forget the last auto-fix
  const boundary = (it==='insertText'&&(d===' '||/[.!?,;:]/.test(d||'')))||it==='insertLineBreak'||it==='insertParagraph';
  if(!boundary){ scheduleSpellStrip(ta); return; }
  const val=ta.value; const caret=ta.selectionStart;
  let end=caret-1; if(end<0){ scheduleSpellStrip(ta); return; }
  let start=end; while(start>0 && /[A-Za-z']/.test(val[start-1])) start--;
  const word=val.slice(start,end); if(!word){ scheduleSpellStrip(ta); return; }
  const lower=word.toLowerCase(); let fixed=word;
  if(_rejected.has(lower)){ /* you told me to leave this word alone */ }
  else if(_LEARN[lower]!==undefined){ fixed=_applyCase(word,_LEARN[lower]); }
  else if(AUTOCORRECT[lower]!==undefined){ fixed=_applyCase(word,AUTOCORRECT[lower]); }
  else if(lower==='i'){ fixed='I'; }
  else if(/^[a-z][a-z']*$/.test(word) && !/'/.test(word)){
    const c=_correct(word); if(c) fixed=_applyCase(word,c);       // capitalised words skipped → names protected
  }
  const before=val.slice(0,start);
  if(/(^|[.!?]\s+|\n\s*)$/.test(before) && /^[a-z]/.test(fixed)) fixed=fixed.charAt(0).toUpperCase()+fixed.slice(1);
  if(fixed!==word){ const delta=fixed.length-word.length;
    ta.value=val.slice(0,start)+fixed+val.slice(end);
    ta.selectionStart=ta.selectionEnd=caret+delta;
    if(/^[a-z]/i.test(word)) _lastAuto={from:word,to:fixed,start:start}; }
  else _lastAuto=null;
  scheduleSpellStrip(ta);
}
/* ---- live "spelling issues" strip under the note box ---- */
let _spellTimer=null;
function scheduleSpellStrip(ta){ clearTimeout(_spellTimer); _spellTimer=setTimeout(()=>updateSpellStrip(ta),300); }
function updateSpellStrip(ta){ ta=ta||document.getElementById('edText'); const el=document.getElementById('edSpell');
  if(!ta||!el) return; if(!_DICT)_buildDict();
  const seen=new Set(), bad=[]; const re=/[A-Za-z][A-Za-z']*/g; let m;
  while((m=re.exec(ta.value))){ const raw=m[0]; const w=raw.toLowerCase();
    if(w.length<2) continue;
    if(_DICT.has(w)||_USERDICT.has(w)||_rejected.has(w)||AUTOCORRECT[w]!==undefined) continue;
    if(seen.has(w)) continue; seen.add(w); bad.push(raw); if(bad.length>=40) break; }
  if(!bad.length){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='';
  el.innerHTML='<span class="es-lbl">⚠ Check:</span>'+bad.map(w=>`<button class="es-chip" onclick="spellChip(event,'${esc(w)}')">${escHTML(w)}</button>`).join('');
}
function closeSpellPop(){ const p=document.getElementById('spellpop'); if(p) p.remove(); }
document.addEventListener('click',closeSpellPop);
function spellChip(ev,word){ ev.stopPropagation(); closeSpellPop();
  const sug=_suggest(word,5);
  const pop=document.createElement('div'); pop.className='vmenu'; pop.id='spellpop';
  pop.innerHTML=(sug.length?sug.map(s=>`<button onclick="spellReplace('${esc(word)}','${esc(s)}')"><b>${escHTML(s)}</b></button>`).join('')
      :'<div style="padding:8px 11px;color:var(--soft);font-size:13px">No suggestion found</div>')
    +'<div class="cp-sep"></div>'
    +`<button onclick="spellIgnore('${esc(word)}')">🚫 Ignore this time</button>`
    +`<button onclick="spellAdd('${esc(word)}')">➕ Add to my dictionary</button>`;
  document.body.appendChild(pop);
  const r=ev.currentTarget.getBoundingClientRect(); const mh=pop.offsetHeight, mw=pop.offsetWidth;
  let top=r.top-mh-6; if(top<8) top=r.bottom+6; let left=r.left; if(left+mw>window.innerWidth-8) left=window.innerWidth-mw-8;
  pop.style.top=top+'px'; pop.style.left=Math.max(8,left)+'px'; }
function spellReplace(from,to){ closeSpellPop(); const ta=document.getElementById('edText'); if(!ta) return;
  const re=new RegExp('\\b'+from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
  ta.value=ta.value.replace(re,mm=>_applyCase(mm,to));
  _LEARN[from.toLowerCase()]=to; _saveLearn();     // learn from your choice
  _lastAuto=null; updateSpellStrip(ta); ta.focus(); }
function spellIgnore(word){ closeSpellPop(); _rejected.add(word.toLowerCase()); updateSpellStrip(); }
function spellAdd(word){ closeSpellPop(); const w=word.toLowerCase(); _USERDICT.add(w); _saveUserDict();
  if(_DICT){_DICT.add(w); _RANK.set(w,850000);} updateSpellStrip(); toast('Added “'+word+'” to your dictionary'); }

function verseText(name,ch,v){ return ((((window.BIBLE||{})[state.version]||{})[name]||{})[String(ch)]||{})[String(v)]||''; }

  const verse=v==='0'?'':verseText(b,ch,v);

  return {b,ch,v,ref,verse,body}; }
function _composeNote(p,mode){ return _composeNoteBase(p,mode)+'\nbible.getwordwisdom.com'; }

  return (p.verse?`${p.ref} (${state.version})\n${p.verse}\n\n`:`${p.ref}\n`)+`📝 ${p.body}\n\n— Nii Okai · Never Get Bored`; }

  _clip(_composeNote(p,mode), mode==='verse'?'Verse copied':mode==='note'?'Note copied':'Verse + note copied'); }

  if(navigator.share){ navigator.share({title:p.ref,text:t}).catch(()=>{}); } else _clip(t,'Copied — paste anywhere to share'); }
function _clip(t,msg){ if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>toast(msg||'Copied'),()=>_clipFallback(t,msg));
  else _clipFallback(t,msg); }
function _clipFallback(t,msg){ const ta=document.createElement('textarea'); ta.value=t;
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select();

function corrMenu(ev,btn){ ev.stopPropagation(); closeVerseMenu(); closeCopyMenus();
