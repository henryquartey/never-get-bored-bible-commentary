let searchTimer=null;
function onSearch(q){ clearTimeout(searchTimer); searchTimer=setTimeout(()=>doSearch(q),180); }
function doSearch(q){
  q=q.trim();
  if(q.length<2){ if(state.view==='search'){ state.view='read'; setViewTabs(); render(); } return; }
  state.view='search'; setViewTabs();
  document.getElementById('crumb').textContent='Search';
  document.getElementById('chapselWrap').style.display='none';
  document.getElementById('readfoot').style.display='none';
  const ql=q.toLowerCase();
  // A typed reference ("jer 22:19", "psalm 23", "1 kings 2") becomes a jump card
  let refRow='';
  { const m=q.match(/^([1-3]?\s?[a-z]+(?:\s+[a-z]+)*?)\.?\s+(\d+)(?:\s*[:.]\s*(\d+))?$/i);
    if(m&&window.BOOKS){ const bq=m[1].replace(/\s+/g,' ').trim().toLowerCase();
      const hit=window.BOOKS.find(b=>b.name.toLowerCase()===bq)
        ||window.BOOKS.find(b=>b.name.toLowerCase().startsWith(bq))
        ||window.BOOKS.find(b=>b.name.toLowerCase().replace(/\s/g,'').startsWith(bq.replace(/\s/g,'')));
      if(hit){ const chn=Math.max(1,Math.min(hit.chapters.length,parseInt(m[2],10)));
        const vn=m[3]?parseInt(m[3],10):0;
        refRow=`<div class="hcard" style="cursor:pointer;margin-bottom:14px" onclick="openChapter('${esc(hit.name)}',${chn})${vn?`;setTimeout(()=>jumpVerse(${vn}),500)`:''}">
          <div class="hk">📖 Go to</div><h3 style="margin:4px 0 0">${escHTML(hit.name)} ${chn}${vn?':'+vn:''} →</h3></div>`; } } }
  // commentary results
  let comm=[];
  for(const bk in DATA)for(const ch in DATA[bk])for(const v in DATA[bk][ch])
    DATA[bk][ch][v].forEach(nt=>{ if(nt.text.toLowerCase().includes(ql))
      comm.push({bk,ch,v,text:nt.text}); });
  // scripture results in loaded version
  let scrip=[]; const bib=window.BIBLE[state.version]||{};
  outer:for(const bk in bib){ for(const ch in bib[bk]){ for(const v in bib[bk][ch]){
    const t=bib[bk][ch][v]; if(t&&t.toLowerCase().includes(ql)){ scrip.push({bk,ch,v,text:t});
      if(scrip.length>=150)break outer; } } } }
  let html=`<div class="page">
    ${refRow}
    <div class="mc-head"><h2>“${escHTML(q)}”</h2><span class="mc-count">${comm.length} in commentary · ${scrip.length}${scrip.length>=150?'+':''} in ${state.version}</span></div>`;
  if(comm.length){ html+='<div class="book-group" style="padding-left:0">Your commentary</div>';
    comm.slice(0,80).forEach(r=>{ const ref=r.v==='0'?`${r.bk} ${r.ch}`:`${r.bk} ${r.ch}:${r.v}`;
      html+=`<div class="sr-item" onclick="jumpTo('${esc(r.bk)}',${r.ch},${r.v==='0'?1:r.v})">
        <div class="r">${ref}<span class="sr-tag">note</span></div>
        <div class="t">${hl(r.text,q,160)}</div></div>`; }); }
  if(scrip.length){ html+='<div class="book-group" style="padding-left:0">Scripture</div>';
    scrip.slice(0,80).forEach(r=>{ html+=`<div class="sr-item" onclick="jumpTo('${esc(r.bk)}',${r.ch},${r.v})">
        <div class="r">${r.bk} ${r.ch}:${r.v}</div>
        <div class="t">${hl(r.text,q,200)}</div></div>`; }); }
  if(!comm.length&&!scrip.length) html+='<div class="empty"><div class="big">🔍</div>No matches.</div>';
  html+='</div>';
  document.getElementById('reader').innerHTML=html;
  document.getElementById('reader').scrollTop=0;
}
function hl(text,q,max){
  let t=text; const i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i>60){ t='…'+t.slice(i-50); } if(t.length>max){ t=t.slice(0,max)+'…'; }
  return escHTML(t).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
}

/* ---------- Import / Export ---------- */
function exportCommentary(){
  const blob=new Blob(['window.COMMENTARY_SEED='+JSON.stringify(DATA,null,1)+';'],{type:'text/javascript'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='commentary.js'; a.click();
  // also offer json
  const blob2=new Blob([JSON.stringify(DATA,null,1)],{type:'application/json'});
  const a2=document.createElement('a'); a2.href=URL.createObjectURL(blob2); a2.download='commentary.json';
  setTimeout(()=>a2.click(),120);
  state.dirty=false;
  toast('Exported commentary.js + .json — replace the files in your data folder to keep changes');
}
function importCommentary(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{
    let txt=r.result.trim();
    txt=txt.replace(/^window\.COMMENTARY_SEED\s*=/,'').replace(/;?\s*$/,'');
    const obj=JSON.parse(txt);
    if(!confirm('Import will MERGE these notes into your current commentary. Continue?')){ev.target.value='';return;}
    mergeCommentary(obj); persist(); markDirty();
    render(); toast('Imported & merged');
  }catch(e){ toast('Could not read that file'); } ev.target.value=''; };
  r.readAsText(f);
}
function mergeCommentary(obj){
  for(const bk in obj)for(const ch in obj[bk])for(const v in obj[bk][ch]){
    DATA[bk]=DATA[bk]||{}; DATA[bk][ch]=DATA[bk][ch]||{}; DATA[bk][ch][v]=DATA[bk][ch][v]||[];
    const existing=new Set(DATA[bk][ch][v].map(n=>n.text.trim()));
    obj[bk][ch][v].forEach(n=>{ if(!existing.has((n.text||'').trim())) DATA[bk][ch][v].push(n); });
  }
}

        if(el.getBoundingClientRect().bottom>top+10){ anchor=el.dataset.v; break; } } } }
  document.documentElement.classList.toggle('hide-notes');
  const off=document.documentElement.classList.contains('hide-notes');
  document.getElementById('notesBtn').classList.toggle('active',!off);
  document.getElementById('notesBtn').title=off?'Currently scripture-only — tap to show commentary':'Showing commentary — tap for scripture only';
  savePrefs();
  if(state.view==='read'){ renderRead();
    if(anchor){ const el=document.getElementById('v'+anchor); if(el) el.scrollIntoView({block:'start'}); } }
  if(typeof _fabSync==='function') _fabSync(); }
/* ---------- Reference commentary layer (Matthew Henry, public domain, lazy-loaded) ---------- */
function ensureRefIndex(cb){ if(window.REFCOMM_BOOKS) return cb();
  const s=document.createElement('script'); s.src='data/mhc/_index.js'; s.onload=cb; s.onerror=()=>{ window.REFCOMM_BOOKS={MHC:[]}; cb(); }; document.head.appendChild(s); }
function ensureRefBook(book,cb){ if(window.REFCOMM&&window.REFCOMM.MHC&&window.REFCOMM.MHC[book]) return cb(true);
  const s=document.createElement('script'); s.src='data/mhc/'+encodeURIComponent(book)+'.js';
  s.onload=()=>cb(true); s.onerror=()=>cb(false); document.head.appendChild(s); }
function refInstalled(){ return !!(window.REFCOMM_BOOKS&&window.REFCOMM_BOOKS.MHC&&window.REFCOMM_BOOKS.MHC.length); }
function _syncRefUI(){ const on=state.refcomm;
  const rb=document.getElementById('refBtn'); if(rb) rb.classList.toggle('active',on);
  const tb=document.getElementById('refToggleBtn'); if(tb) tb.classList.toggle('on',on);
  const st=document.getElementById('refState'); if(st) st.textContent=on?'On':'Off'; }
function toggleRefComm(){ state.refcomm=!state.refcomm; savePrefs(); _syncRefUI();
  if(state.refcomm){ ensureRefIndex(()=>{ if(!refInstalled()) toast('Matthew Henry isn’t installed yet — run “Get Matthew Henry.command” in the tools folder');
    if(state.view==='read') renderRead(); }); }
  else if(state.view==='read') renderRead();
}
/* returns the HTML panel for the current chapter (or '' ) and kicks off lazy load if needed */
function refCommPanel(name,ch){
  if(!state.refcomm) return '';
  if(!window.REFCOMM||!window.REFCOMM.MHC||!window.REFCOMM.MHC[name]){
    if(refInstalled() && (window.REFCOMM_BOOKS.MHC.indexOf(name)>=0) && !_refTried[name]){
      _refTried[name]=1; ensureRefBook(name,()=>{ if(state.refcomm&&state.view==='read') renderRead(); });
    }
    return '';
  }
  const chap=window.REFCOMM.MHC[name][String(ch)]; if(!chap||!chap.length) return '';
  const rows=chap.map(e=>`<p class="rc-p">${e.v?`<b>v${e.v}</b> `:''}${escHTML(e.t)}</p>`).join('');
  return `<details class="refcomm"><summary>📖 Matthew Henry’s Commentary — ${escHTML(name)} ${ch} <span class="rc-pd">public domain · not Nii Okai’s journal</span></summary>
    <div class="refcomm-body">${rows}</div></details>`;
}
function togglePreview(){ const on=document.body.classList.toggle('as-public');
  const b=document.getElementById('previewBtn');
  b.classList.toggle('active',on); b.textContent= on?'✕ Exit reader preview':'👁 Preview as a reader';
  // mimic a fresh reader: owner-unlocked extras (e.g. the dates you unlocked) are hidden until they read the Welcome
  document.getElementById('dateBtn').style.display = (!on && localStorage.getItem('nok_dates_unlocked'))?'':'none'; }
function toggleSidebar(open){ document.getElementById('sidebar').classList.toggle('open',open);
  document.getElementById('backdrop').classList.toggle('show',open); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3200); }
function esc(s){ return String(s).replace(/'/g,"\\'"); }
function escHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeEditor();
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&editing)saveEditor(); });
window.addEventListener('beforeunload',e=>{ if(state.dirty){ e.preventDefault(); e.returnValue=''; } });

init();
/* Heavy data (Bible text, spell dictionary) loads in the background after first paint */
_syncThemeColor();
window.addEventListener('load',()=>{ setTimeout(()=>{
  ensureVersion(state.version,()=>{ if(state.view==='read') render(); });
  const d=document.createElement('script'); d.src='data/dict.js';
  d.onload=()=>{ _DICT=null; }; document.head.appendChild(d);
},60); });
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      try{ reg.update(); setInterval(()=>reg.update(),30*60*1000); }catch(e){}
      // A new version downloaded and waiting → offer it; the reader decides when to switch.
      reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',()=>{ if(nw.state==='installed'&&navigator.serviceWorker.controller){ window._swWaiting=nw; if(!_updShown){ _updShown=true; _showUpdBar(); } } }); });
      if(reg.waiting&&navigator.serviceWorker.controller){ window._swWaiting=reg.waiting; if(!_updShown){ _updShown=true; _showUpdBar(); } }
    }).catch(()=>{});
    let _rl=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_rl||!window._updClicked) return; _rl=true; location.reload(); });
  });
}
/* ---- Update alert: tell the reader when a new version has been deployed ---- */
let _updTag=null,_updShown=false;
async function _updCheck(){ try{
  const r=await fetch('index.html',{method:'HEAD',cache:'no-store'}); if(!r.ok) return;
  const t=r.headers.get('etag')||r.headers.get('last-modified'); if(!t) return;
  if(_updTag===null){ _updTag=t; return; }
  if(t!==_updTag&&!_updShown){ _updShown=true; _showUpdBar(); }
}catch(e){} }
async function _showUpdBar(){ if(document.getElementById('updbar')) return;
  let vtxt='A new version is available';
  try{ const t=await (await fetch('index.html',{cache:'no-store'})).text();
    const m=t.match(/BUILD=\{v:'([\d.]+)'/); if(m) vtxt='Version '+m[1]+' is available'; }catch(e){}
  const b=document.createElement('div'); b.className='updbar'; b.id='updbar';
  b.innerHTML='✨ '+vtxt
    +'<button class="upd-btn" onclick="_doUpdate()">Update</button>'
    +'<button class="upd-x" onclick="document.getElementById(\'updbar\').remove()" title="Later">✕</button>';
  document.body.appendChild(b); }
function _doUpdate(){
  window._updClicked=true;
  const done=()=>location.reload();
  if(window._swWaiting){ try{ window._swWaiting.postMessage('skipWaiting'); }catch(e){} setTimeout(done,1200); return; }
  if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistration){
    navigator.serviceWorker.getRegistration().then(reg=>{ if(reg) return reg.update(); }).then(done,done);
  } else done(); }
window.addEventListener('load',()=>{ _updCheck(); setInterval(_updCheck,30*60*1000); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) _updCheck(); });
</script>
